# Spherical ACCESS airship. Every value says where it comes from:
#   confirmed  - confirmed by Mana or stated in an official ACCESS document
#   derived    - computed from confirmed values
#   assumption - default chosen by Claude; needs confirming before results are final
#
# Sources:
#   SFOC   = ACCESS_SFOC_Application_Tethered_Airship_Oct_2026 (Transport Canada application)
#   Final  = reference/Final.py (conference-paper code)
#   paper  = OPTIMIZATION_ZANDVAKILI.docx

hull:
  shape: sphere
  diameter_m: 3.15            # confirmed (Mana; SFOC sec. 3; drawing DWG 2)
  volume_m3: 16.4             # derived: 4/3*pi*r^3 = 16.37 m^3 (SFOC and design: 16.4; QUOTE: 16.5)
  ballonet_volume_m3: 0.28    # confirmed (QUOTE; project page): 0.82 m sphere
  ballast_bars_kg: [1.0, 1.0, 1.0]  # confirmed (QUOTE): 3 lead bars for rough balancing, plus 6 balance pockets

air:
  density_kg_m3: 1.225        # assumption: ISA sea level, 15 C (Arctic -15 C air is ~1.37)

mass:
  # From the ACCESS mass budget (STARLab spreadsheet). Total 16.16 kg with helium.
  # Displaced air: 1.225 * 16.4 = 20.09 kg, so ~3.93 kg of trim ballast (lead bars + balance
  # pockets) makes the airship neutrally buoyant. Positions: body frame, origin at the hull
  # centre, z up. Kinds: shell (thin spherical shell, radius = hull), solid_sphere (radius = hull),
  # point (at z_m on the axis), ring (horizontal ring of radius ring_m at height z_m).
  components:
    envelope_and_fittings: {kg: 6.485, kind: shell}        # confirmed (envelope, ballonet, valves, pockets, windows...)
    screws_washers:        {kg: 0.165, kind: shell}        # confirmed
    hull_motors_mounts:    {kg: 2.08,  kind: ring, z_m: 0.0, ring_m: 1.575}  # confirmed: 4 motors on the equator
    hull_escs:             {kg: 0.130, kind: ring, z_m: 0.0, ring_m: 1.575}  # confirmed mass; location assumed (at the motors)
    valve_covers:          {kg: 0.051, kind: point, z_m: -1.575}              # confirmed mass; at the bottom
    air_blower:            {kg: 0.340, kind: point, z_m: -1.825}              # confirmed mass; assumed in the gondola
    gondola_electronics:   {kg: 2.792, kind: point, z_m: -1.825}              # confirmed ("bottom weight"); hang height assumed
    top_payload:           {kg: 1.062, kind: point, z_m: 1.575}               # confirmed mass (mass dummy + GPS); assumed on top (Starlink)
    helium:                {kg: 2.871, kind: solid_sphere}                    # confirmed
    ballonet_air:          {kg: 0.185, kind: point, z_m: -1.165}              # confirmed (50 % full); ballonet sits at the bottom
  trim:
    mode: neutral          # assumption: ballast added until weight = buoyancy
    kind: ring             # lead bars / balance pockets on the lower hull
    z_m: -1.45             # assumption
    ring_m: 0.615          # = sqrt(1.575^2 - 1.45^2): on the hull surface
  helium_in_inertia: true  # brief: count the helium as a solid sphere (an upper bound; real gas lags)
  gondola_drop_m: 0.25     # assumption: gondola 0.25 m below the hull bottom
  added_mass_coeff: 0.5    # sphere: added mass = 0.5 * rho * V on each translational axis
  added_inertia_kgm2: [0.0, 0.0, 0.0]   # sphere: ~0

propulsion:
  # QUOTE = Aero Drum official quotation, 3.15 m sphere with ballonet (Aug 2025)
  motor: Kavan C3536          # QUOTE: 1250 kV; mass budget: 1000 kV. 4 hull motors, Kavan 50 A ESCs, 11-inch props, 4S battery
  propeller_in: 11            # confirmed (QUOTE)
  # Kavan publishes no static-thrust figure for this motor. It is rated 420 W max (30 s, 4S),
  # with 11x5 recommended on 3S; motors of this class with an 11-inch prop give roughly
  # 1.2-1.3 kg (12-13 N) at full throttle. Final.py used 2.5 N (a 7-inch prop).
  u_max_N: 12.0               # estimate: needs a thrust-stand measurement
  reverse_thrust: false       # optimizer layouts are push-only (brief); the STARLab reference layout is reversible (Mana)
  motor_time_constant_s: 0.10 # assumption
  arm_tube: 15x1 mm aluminium # confirmed (QUOTE); arm length not given, motors modelled on the hull surface

dynamics:
  physics_hz: 100          # brief: RK4 at 100 Hz
  control_hz: 10           # brief: controller / RL at 10 Hz
  drag_coeff: 0.4          # sphere, Re ~ 1e5 (brief)
  rot_damping_lin: [2.0, 2.0, 2.0]   # N*m*s per rad/s, assumption (aerodynamic + gondola swing damping)
  rot_damping_quad: [5.0, 5.0, 5.0]  # N*m*s^2 per (rad/s)^2, assumption
  disturbance_torque_sigma_Nm: 0.05  # per-episode constant torque (seams, offsets), assumption

wind:                      # values used when no scenario overrides them
  mean_speed_m_s: 0.0
  mean_dir_deg: 0.0        # direction the wind blows TOWARD, from +x, counter-clockwise
  turbulence_sigma_m_s: [0.5, 0.5, 0.25]   # OU turbulence (x, y, z), assumption
  turbulence_tau_s: 2.0                    # OU correlation time, assumption
  gust_rate_per_min: 0.0
  gust_amplitude_m_s: [1.0, 3.0]           # 1-cos gust peak, range
  gust_duration_s: [2.0, 6.0]

operating_limits:             # confirmed (SFOC sec. 7 / Appendix A)
  sustained_wind_max_m_s: 5.6
  gust_max_m_s: 8.3
  max_altitude_agl_m: 8.0
  max_horizontal_radius_m: 20.0

tasks:
  path_following_radius_m: 50.0   # confirmed (Mana; paper)

optimizer:
  objectives: [count, effort, position_symmetry, direction_symmetry, geometric]   # confirmed: the paper's five
  K_candidates: 30                # confirmed (paper)
  gondola_keepout_deg: 35.0       # confirmed (paper)
